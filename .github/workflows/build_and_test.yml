name: plv8 Build and Test
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        version:
          [
            REL_14_STABLE,
            REL_15_STABLE,
            REL_16_STABLE,
            REL_17_STABLE,
            REL_18_BETA1
          ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Test details
        run: echo Build and test plv8 on ${{ matrix.os }} with PostgreSQL ${{ matrix.version }} branch

      - name: Checkout and build PostgreSQL code
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev flex bison libxml2-dev libxslt-dev libssl-dev libxml2-utils xsltproc ccache pkg-config libc++-dev libc++abi-dev libglib2.0-dev libtinfo6 cmake libstdc++-12-dev
          rm -rf postgres
          git clone --branch ${{ matrix.version }} --single-branch --depth 1 https://github.com/postgres/postgres.git
          pushd postgres
          git branch
          ./configure --prefix=$PWD/inst/  --enable-cassert --enable-debug --with-openssl
          make -j4 install

      - name: Start Postgres
        run: |
          pushd postgres
          cd inst/bin
          ./initdb -D data
          ./pg_ctl -D data -l logfile start
          popd

      - name: Checkout plv8 extension code
        uses: actions/checkout@v2
        with:
          path: plv8

      - name: Build and test plv8 extension
        id: regression-tests
        run: |
          export PATH="${PWD}/postgres/inst/bin:$PATH"
          pushd plv8
          make install
          make installcheck
          popd

      - name: Print regression.diffs if regression tests failed
        if: failure() && steps.regression-tests.outcome != 'success'
        run: |
          cat plv8/regression.diffs

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        pg_version: ["18"]
    steps:
      - name: Checkout plv8
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache V8 build
        uses: actions/cache@v4
        id: v8-cache
        with:
          path: deps/v8-cmake/build
          key: v8-cmake-${{ hashFiles('deps/v8-cmake/**') }}-windows

      - name: Install tools
        run: |
          choco install ninja -y
          choco install postgresql${{ matrix.pg_version }} --params '/Password:test' -y
          echo "C:\Program Files\PostgreSQL\${{ matrix.pg_version }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.40'

      - name: Patch PG18 atomics header for MSVC
        shell: pwsh
        run: |
          platforms\windows\patch_pg_atomics.ps1 -PgVersion ${{ matrix.pg_version }}

      - name: Build V8
        if: steps.v8-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: platforms\windows\build_v8.bat

      - name: Configure plv8
        shell: cmd
        run: |
          cmake -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_INSTALL_PREFIX="C:\Program Files\PostgreSQL\${{ matrix.pg_version }}" ^
            -DPOSTGRESQL_VERSION=${{ matrix.pg_version }} ^
            platforms\windows

      - name: Build plv8
        shell: cmd
        run: cmake --build . --config Release

      - name: Install plv8
        shell: cmd
        run: cmake --install . --config Release

      - name: Smoke test
        shell: cmd
        env:
          PGPASSWORD: test
        run: |
          pg_ctl -D "C:\Program Files\PostgreSQL\${{ matrix.pg_version }}\data" start
          psql -U postgres -c "CREATE EXTENSION plv8;"
          psql -U postgres -c "SELECT plv8_version();"
          psql -U postgres -c "DO $$ plv8.elog(NOTICE, 'hello from windows'); $$ LANGUAGE plv8;"
